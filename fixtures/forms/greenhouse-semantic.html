<!doctype html>
<!--
  Fixture: a Greenhouse-shaped application, for the SEMANTIC FALLBACK.

  HONESTY NOTE, WHICH MATTERS MORE THAN THE FIXTURE.
  This markup is hand-written from Greenhouse's published field-naming
  conventions. It was NOT captured from a real application, because nobody has
  run this build against one yet. IMPLEMENTATION_STATUS.md says the same thing
  in plain words, and engineering.md already lists "tests are all against markup
  we wrote ourselves" as a known weakness. This file does not fix that weakness;
  it makes the code ready for the capture that does.

  What is real, and is the reason the fixture is shaped this way:
    - the `job_application[answers_attributes][N][...]` namespacing, which is
      why `attributeNameVariants` exists;
    - custom questions rendered as plain <select>s whose labels are prose, with
      no `autocomplete` and no alias-friendly `name`. These are exactly the
      fields the deterministic cascade refuses, and therefore exactly what this
      subsystem is for.
-->
<html lang="en">
  <head><meta charset="utf-8" /><title>Apply</title></head>
  <body>
    <form id="application_form">
      <!-- Handled by the deterministic engine. Present so the fixture proves
           the semantic pass does not disturb what already worked. -->
      <label for="first_name">First Name *</label>
      <input id="first_name" name="job_application[first_name]" type="text" autocomplete="given-name" />

      <label for="email">Email *</label>
      <input id="email" name="job_application[email]" type="email" autocomplete="email" />

      <!-- A custom question. No alias matches "which of our campuses", the name
           is a generated ordinal, and the options are the company's own. The
           mapper refuses this, correctly. -->
      <label for="q1">Which of our university partners did you attend?</label>
      <select id="q1" name="job_application[answers_attributes][0][text_value]">
        <option value=""></option>
        <option value="1">Rutgers University</option>
        <option value="2">Princeton University</option>
        <option value="3">Stevens Institute of Technology</option>
      </select>

      <!-- The mapper DOES name this one (fieldOfStudy), and the resolver then
           refuses it: the stored "Computer Engineering" matches none of these
           strings exactly. This is the `no_matching_option` path. -->
      <label for="q2">Field of study</label>
      <select id="q2" name="job_application[answers_attributes][1][text_value]">
        <option value=""></option>
        <option value="1">Engineering, Civil</option>
        <option value="2">Engineering, Computer</option>
        <option value="3">Engineering, Mechanical</option>
      </select>

      <!-- Years of experience as buckets. No string operation bridges a stored
           number and a range label; this is what stage 2 exists for. -->
      <label for="q3">How many years of professional software experience do you have?</label>
      <select id="q3" name="job_application[answers_attributes][2][text_value]">
        <option value=""></option>
        <option value="1">Less than 1 year</option>
        <option value="2">1-3 years</option>
        <option value="3">3-5 years</option>
        <option value="4">5+ years</option>
      </select>

      <!-- MUST STILL REQUIRE A CLICK. Worded so no alias matches it, so it
           reaches the semantic pass - which is precisely the case where the
           confidence cap has to hold. -->
      <label for="q4">Would you now or in the future need us to support an immigration filing on your behalf?</label>
      <select id="q4" name="job_application[answers_attributes][3][text_value]">
        <option value=""></option>
        <option value="1">Yes</option>
        <option value="2">No</option>
      </select>
    </form>
  </body>
</html>
